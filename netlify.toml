[build]
  command = "npm run build"

# Next/Turbopack เก็บแคชคอมไพล์ไว้ใน .next/cache ซึ่งมีค่า env ที่ใช้ตอน build (เช่น DATABASE_URL, CRON_SECRET)
# แคชนี้ไม่ได้ถูกเสิร์ฟให้ผู้ใช้ แต่ตัวสแกน secret ของ Netlify เห็นว่าเป็น "ค่าลับอยู่ในไฟล์ build" แล้วให้ build ล้ม
# จึงยกเว้นเฉพาะโฟลเดอร์แคชนี้ (ไม่ปิดการสแกนทั้งหมด จะได้ยังจับกรณีค่าลับหลุดเข้าโค้ดหรือหน้าเว็บจริง)
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
# ตัวแปร NEXT_PUBLIC_* ถูก Next.js ฝังลงโค้ดฝั่งเว็บโดยตั้งใจ (เป็นค่าสาธารณะ: URL ของ Supabase, publishable key, URL เว็บ)
# ตัวสแกนจึงเจอค่าเหล่านี้ในผลลัพธ์ build เสมอ รวมถึงตัวแปรตั้งค่าที่ไม่ใช่ความลับซึ่งค่าไปตรงกับข้อความในโค้ด/ตัวอย่าง env
# (ชื่อผู้ส่ง SMS, URL และชื่อโมเดล AI, เปอร์เซ็นต์ค่าบริการ) ห้ามเอาตัวแปรที่เป็นความลับจริง (คีย์ รหัสผ่าน secret) มาใส่ที่นี่
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SITE_URL,SMSKUB_SENDER,AI_BASE_URL,AI_MODEL,AI_FALLBACK_MODELS,AI_VISION_BASE_URL,AI_VISION_MODEL,AI_VISION_FALLBACK_MODELS,OPENROUTER_MODEL,OPENROUTER_FALLBACK_MODELS,OPENROUTER_VISION_MODEL,OPENROUTER_VISION_FALLBACK_MODELS,PAYSO_BASE_URL"
