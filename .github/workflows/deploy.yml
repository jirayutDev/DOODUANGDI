name: Deploy to Windows server

# ดีพลอยเมื่อมีการ push เข้า main เท่านั้น (ไม่ใช้ pull_request เพราะ runner รันบนเซิร์ฟเวอร์จริง
# ห้ามให้โค้ดจาก PR/fork ที่ยังไม่ผ่านการรีวิวไปรันบนเครื่องนี้)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: C:\apps\doodoungdi
  TASK_NAME: doodoungdi-app
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  deploy:
    runs-on: [self-hosted, windows, doodoungdi]
    timeout-minutes: 30
    steps:
      # ดึงโค้ดตรงเข้า APP_DIR โดยไม่แตะไฟล์ที่ git ไม่ติดตาม (.env.local, logs, node_modules)
      - name: Fetch code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path "$env:APP_DIR\.env.local")) { throw ".env.local ไม่อยู่ใน $env:APP_DIR — สร้างก่อนดีพลอย" }
          if (-not (Test-Path "$env:APP_DIR\.git")) { git -C $env:APP_DIR init; if ($LASTEXITCODE -ne 0) { exit 1 } }
          git -C $env:APP_DIR fetch --depth 1 "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $env:APP_DIR checkout -f FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install dependencies
        shell: powershell
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Typecheck
        shell: powershell
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # หยุดแอปก่อน build กัน .next ถูกเขียนทับขณะมีคนใช้งาน (มี downtime ช่วง build ประมาณ 1-3 นาที)
      - name: Stop app
        shell: powershell
        run: Stop-ScheduledTask -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue

      - name: Build
        shell: powershell
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "build ล้มเหลว — เริ่มแอปรุ่นก่อนหน้ากลับมา"
            Start-ScheduledTask -TaskName $env:TASK_NAME
            exit 1
          }

      - name: Start app
        shell: powershell
        run: Start-ScheduledTask -TaskName $env:TASK_NAME

      - name: Health check
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest http://127.0.0.1:3000 -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "แอปพร้อมแล้ว"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 2
          }
          Write-Host "แอปไม่ตอบสนองหลังดีพลอย ดู C:\apps\doodoungdi\logs\out.log"
          exit 1
